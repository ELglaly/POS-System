# ─────────────────────────────────────────────────────────────────────────────
# POS Pro — Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=pos-pro

# ── SQLite DataSource ─────────────────────────────────────────────────────────
# Database file stored in user home so it survives application reinstalls.
# The directory must exist before first launch (created by PosSpringConfig init).
spring.datasource.url=jdbc:sqlite:${user.home}/.cashier-pos/cashier.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Connection pool — SQLite supports only one writer at a time; keep pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# update: creates/alters tables to match entities on startup, never drops existing data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# SQLite does not support SEQUENCE — must use IDENTITY (auto-increment)
spring.jpa.properties.hibernate.id.new_generator_mappings=false
# Disable L2 cache for now (EhCache wiring is separate)
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# ── Flyway ────────────────────────────────────────────────────────────────────
# Disabled until V1–V7 migration scripts are added (Deliverable 8).
# When re-enabled: set ddl-auto=none and flyway.enabled=true.
spring.flyway.enabled=false

# ── POS Business Configuration ───────────────────────────────────────────────
pos.shop.name=My Shop
pos.shop.address=123 Main Street
pos.receipt.footer=Thank you for your purchase!
pos.currency.symbol= EGY
pos.camera.index=0
pos.printer.name=

# ── Spring Boot banner ────────────────────────────────────────────────────────
spring.main.banner-mode=off
# Prevent Spring Boot from trying to start an embedded web server
spring.main.web-application-type=none

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.example.cashier=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate.SQL=WARN
